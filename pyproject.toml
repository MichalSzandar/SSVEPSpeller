[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssvep"
version = "0.1.0"
description = "SSVEP BCI speller: signal processing and classification"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "pylsl",
    "pyglet>=2.1",
]

[project.optional-dependencies]
dev = ["pytest", "pylint"]
analysis = ["jupyterlab", "seaborn", "mne"]
# torch is not listed here: install the CPU wheel separately (see PLAN.md §3)
nlp = ["transformers", "wordfreq"]

[tool.setuptools]
packages = ["ssvep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
