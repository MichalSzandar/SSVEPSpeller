[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssvep"
version = "0.1.0"
description = "SSVEP BCI speller: signal processing and classification"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["ssvep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
